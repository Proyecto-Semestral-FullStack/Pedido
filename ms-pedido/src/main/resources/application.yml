spring:
  application:
    name: ms-pedido
  datasource:
    url: jdbc:mysql://localhost:3306/db_pedido?useSSL=false&serverTimezone=UTC
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html # usar localhost:8085/swagger-ui.html para probar la documentacion de la API

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
